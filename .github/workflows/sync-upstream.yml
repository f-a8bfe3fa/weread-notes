name: Daily Sync Upstream

on:
  schedule:
    # 每天北京时间 04:00 运行（UTC 20:00），和每日笔记同步 01:00 错开
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击一键同步

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/f-a8bfe3fa/weread-notes.git 2>/dev/null || true
          git fetch upstream main

      - name: Sync upstream code (preserve user data & workflows)
        run: |
          # 只同步代码与项目配置，绝不碰用户数据、索引和工作流。
          # 子项目的 index.json / data/ / notion_push_failures.json / logs/
          # 是自己的笔记数据，主项目不应覆盖。
          git checkout upstream/main -- \
            scripts/ \
            config.json \
            requirements.txt \
            README.md \
            weread.md \
            .gitignore \
            .gitattributes

      - name: Commit and push updates
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No upstream updates found."
          else
            git commit -m "chore: daily sync upstream code"
            git push origin main
          fi
