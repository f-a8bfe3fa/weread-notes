name: Daily Sync Upstream

on:
  schedule:
    # 每天北京时间 02:00 运行（UTC 18:00），和每日笔记同步 01:00 错开
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持手动点击一键同步

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.UPSTREAM_SYNC_TOKEN }}" ]; then
            echo "Error: UPSTREAM_SYNC_TOKEN is not set."
            echo "Because this workflow may update .github/workflows files, you need a classic"
            echo "Personal Access Token with 'repo' and 'workflow' scopes. Add it as a"
            echo "repository secret named UPSTREAM_SYNC_TOKEN."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/f-a8bfe3fa/weread-notes.git 2>/dev/null || true
          git fetch upstream main

      - name: Sync upstream code (preserve user data)
        run: |
          # 1. 用上游 main 覆盖所有文件（代码、脚本、配置、工作流）
          git checkout upstream/main -- .

          # 2. 恢复用户私有数据与日志，避免被上游测试数据覆盖
          #    data/      : 所有书籍笔记数据
          #    index.json : 书籍索引
          #    notion_push_failures.json : Notion 推送失败日志
          #    logs/      : 未来可能生成的日志目录
          git checkout HEAD -- data/ index.json notion_push_failures.json logs/ 2>/dev/null || true

      - name: Commit and push updates
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No upstream updates found."
          else
            git commit -m "chore: daily sync upstream code and workflows"
            git push origin main
          fi
