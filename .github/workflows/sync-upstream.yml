name: Sync Upstream

on:
  schedule:
    # 每周一自动拉取一次更新（UTC 0:00，北京时间 8:00）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支持在 Actions 页面手动点击一键同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Upstream
        run: |
          git remote add upstream https://github.com/f-a8bfe3fa/weread-notes.git
          git fetch upstream main
          # 合并上游更新，如遇已是最新则自动跳过
          git merge upstream/main -m "chore: sync upstream changes" --allow-unrelated-histories || echo "Already up to date"
          git push origin main
