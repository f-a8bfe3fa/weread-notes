name: Daily Sync Upstream

on:
  schedule:
    # 每天北京时间 04:00 运行（UTC 20:00），和每日笔记同步 01:00 错开
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击一键同步

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/f-a8bfe3fa/weread-notes.git 2>/dev/null || true
          git fetch upstream main

      - name: Sync upstream code (preserve user data & workflows)
        run: |
          # 1. 用上游 main 覆盖代码、脚本、配置
          git checkout upstream/main -- .

          # 2. 恢复本地不想被覆盖的内容
          #    .github/workflows/          : 本地工作流文件
          #    data/                       : 所有书籍笔记数据
          #    index.json                  : 书籍索引
          #    notion_push_failures.json   : Notion 推送失败日志
          #    logs/                       : 未来可能生成的日志目录
          git checkout HEAD -- .github/workflows/ data/ index.json notion_push_failures.json logs/ 2>/dev/null || true

      - name: Commit and push updates
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No upstream updates found."
          else
            git commit -m "chore: daily sync upstream code"
            git push origin main
          fi
