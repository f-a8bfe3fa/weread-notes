name: Sync Upstream

on:
  schedule:
    # 每周一自动拉取一次更新（UTC 0:00，北京时间 8:00）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 支持手动点击一键同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Upstream (Preserve User Data)
        run: |
          # 1. 添加上游主仓库并拉取
          git remote add upstream https://github.com/f-a8bfe3fa/weread-notes.git 2>/dev/null || true
          git fetch upstream main

          # 2. 检出上游的所有更新（覆盖代码、脚本、配置及工作流）
          git checkout upstream/main -- .

          # 3. 强制恢复保留用户本地的数据与索引文件
          git checkout HEAD -- data/ 2>/dev/null || true
          git checkout HEAD -- index.json 2>/dev/null || true

          # 4. 检查是否有核心代码更新并提交
          git add -A
          if git diff --staged --quiet; then
            echo "No code updates found from upstream."
          else
            git commit -m "chore: sync upstream code and workflows (excluding user data)"
            git push origin main
          fi
